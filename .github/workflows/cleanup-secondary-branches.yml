name: One-time secondary branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-secondary-branches.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Delete consolidated secondary branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "feature/configurable-gex-intensity"
            "feature/confluence-volume-model-paid-lab"
            "feature/gex-guide-and-price-centering"
            "feature/gex-history-and-chart-ui"
            "feature/heatmap-compare-expiry"
            "feature/interactive-price-charts"
            "feature/iv-oi-quality"
            "feature/market-dashboard"
            "feature/stress-pinning-scorecard-help"
            "feature/time-map-maxpain-greeks"
            "feature/volume-ratios-smoothing-context"
            "fix/quality-source-timestamp"
            "fix/roadmap-c5-d1"
            "research/repository-feature-review"
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done
