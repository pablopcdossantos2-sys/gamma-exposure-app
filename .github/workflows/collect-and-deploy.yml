name: Coletar GEX e publicar no Pages

on:
  schedule:
    # Seg-sex, de hora em hora, das 13:05 as 21:05 UTC (cobre o pregao dos EUA em EDT e EST).
    # O GitHub pode atrasar execucoes agendadas em alguns minutos.
    - cron: "5 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      save_raw:
        description: "Guardar a resposta original do CBOE (data/raw)?"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ["docs/**", "collector/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

# Evita duas execucoes ao mesmo tempo mexendo nos mesmos arquivos.
concurrency:
  group: gex-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r collector/requirements.txt

      - name: Coletar EWZ (CBOE)
        id: collect
        # Se o CBOE falhar, o site ainda e publicado com os ultimos dados.
        continue-on-error: true
        env:
          SYMBOL: ${{ vars.GEX_SYMBOL || 'EWZ' }}
          MAX_DTE: ${{ vars.GEX_MAX_DTE || '' }}
          MANUAL_RAW: ${{ inputs.save_raw }}
        run: |
          # Resposta original: guardada 2x por dia (hora cheia 15 e 20 UTC) e em execucoes manuais.
          HOUR=$(date -u +%H)
          ARGS=""
          if [ "$HOUR" = "15" ] || [ "$HOUR" = "20" ] || [ "$MANUAL_RAW" = "true" ]; then ARGS="--save-raw"; fi
          if [ -n "$MAX_DTE" ]; then ARGS="$ARGS --max-dte $MAX_DTE"; fi
          python collector/collect.py --symbol "$SYMBOL" $ARGS

      - name: Aviso se a coleta falhou
        if: steps.collect.outcome == 'failure'
        run: echo "::warning::Coleta falhou (veja o log do passo anterior). O site foi publicado com os dados anteriores."

      - name: Salvar dados no repositorio
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data/raw
          if git diff --cached --quiet; then
            echo "Nada novo para salvar."
          else
            git commit -m "dados: coleta GEX $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
