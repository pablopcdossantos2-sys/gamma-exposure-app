name: Coletar mercado e publicar no Pages

on:
  schedule:
    # A cada 15 min em dias úteis durante a janela que cobre B3 + mercado dos EUA.
    # Minutos deslocados do quarto de hora reduzem a chance de fila do GitHub Actions.
    - cron: "7,22,37,52 12-22 * * 1-5"
  workflow_dispatch:
    inputs:
      save_raw:
        description: "Guardar a resposta original do CBOE (data/raw)?"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/app.js"
      - "docs/style.css"
      - "collector/**"
      - ".github/workflows/**"
      - "README.md"
      - "CALCULO.md"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gex-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - run: pip install -r collector/requirements.txt

      - name: Coletar Gamma Exposure do EWZ (CBOE)
        id: collect_gex
        continue-on-error: true
        env:
          SYMBOL: ${{ vars.GEX_SYMBOL || 'EWZ' }}
          MAX_DTE: ${{ vars.GEX_MAX_DTE || '' }}
          MANUAL_RAW: ${{ inputs.save_raw }}
        run: |
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)
          ARGS=""
          # Guarda raw duas vezes por dia e em execuções manuais.
          if { [ "$HOUR" = "15" ] || [ "$HOUR" = "20" ]; } && [ "$MINUTE" = "07" ]; then ARGS="--save-raw"; fi
          if [ "$MANUAL_RAW" = "true" ]; then ARGS="--save-raw"; fi
          if [ -n "$MAX_DTE" ]; then ARGS="$ARGS --max-dte $MAX_DTE"; fi
          python collector/collect.py --symbol "$SYMBOL" $ARGS

      - name: Coletar candles de EWZ e WIN1!
        id: collect_prices
        continue-on-error: true
        run: python collector/collect_prices.py

      - name: Avisos de coleta
        if: always()
        run: |
          if [ "${{ steps.collect_gex.outcome }}" != "success" ]; then
            echo "::warning::A coleta do GEX falhou; o site usará o último GEX salvo."
          fi
          if [ "${{ steps.collect_prices.outcome }}" != "success" ]; then
            echo "::warning::A coleta de preços falhou; o site usará os últimos candles salvos, se existirem."
          fi

      - name: Salvar dados coletados no repositório
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data/raw
          if git diff --cached --quiet; then
            echo "Nada novo para salvar."
          else
            git commit -m "dados: mercado $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
