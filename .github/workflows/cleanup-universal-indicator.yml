name: One-time universal indicator branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-universal-indicator.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete merged universal-indicator branch
        shell: bash
        run: |
          set -euo pipefail
          branch="feature/tradingview-universal"
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
            git push origin --delete "$branch"
          else
            echo "Branch already absent."
          fi
